<text x="512.5" y="252.0" font-size="10.5" fill="#555">GAL +15 ns</text>
<rect x="14" y="393" width="10" height="10" fill="#7a7a7a"/>
<text x="28" y="402" font-size="11" fill="#333">Z80 inside the Model I (not on the bus)</text>
<rect x="319" y="393" width="10" height="10" fill="#1f5fa8"/>
<text x="333" y="402" font-size="11" fill="#333">Model I expansion bus</text>
<rect x="498" y="393" width="10" height="10" fill="#8a4fbf"/>
<text x="512" y="402" font-size="11" fill="#333">Bridge card</text>
<rect x="607" y="393" width="10" height="10" fill="#c0392b"/>
<text x="621" y="402" font-size="11" fill="#333">ECB bus</text>
<text x="14" y="420" font-size="11" fill="#444">Bridge delays (10-30 ns) are drawn wider than scale so the edges can be told apart; one T-state is 564 ns.</text>
<text x="14" y="436" font-size="11" fill="#444">Difference from a real Z80: there, MREQ* starts in T1, a full T-state before WR*. The Model I bus only has the</text>
<text x="14" y="452" font-size="11" fill="#444">combined WR*, so ECB MREQ* starts with WR*. Cards must not rely on MREQ* leading WR* (ours latch on WR* or CE).</text>
<text x="14" y="468" font-size="11" fill="#444">U7 passes Model I data to ECB whenever no claimed read is in progress, so write data is ready long before WR*.</text>
</svg>
