<rect x="498" y="423" width="10" height="10" fill="#c0392b"/>
<text x="512" y="432" font-size="11" fill="#333">ECB bus</text>
<text x="14" y="450" font-size="11" fill="#444">Bridge delays (10-30 ns) are drawn wider than scale so the edges can be told apart; one T-state is 564 ns.</text>
<text x="14" y="466" font-size="11" fill="#444">Inside the Model I, M1* marks the fetch and RFSH* the refresh that follows it. Neither reaches the expansion bus:</text>
<text x="14" y="482" font-size="11" fill="#444">the fetch arrives as an ordinary RD* pulse, and the refresh doesn't arrive at all, because RD* stays high during it.</text>
<text x="14" y="498" font-size="11" fill="#444">So ECB M1* and RFSH* stay high. The only visible difference, a fetch's shorter RD*, is known only once RD* ends.</text>
