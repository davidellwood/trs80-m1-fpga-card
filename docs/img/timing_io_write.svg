<text x="14" y="420" font-size="11" fill="#444">Bridge delays (10-30 ns) are drawn wider than scale so the edges can be told apart; one T-state is 564 ns.</text>
<text x="14" y="436" font-size="11" fill="#444">The data is on ECB from T1 (U7 passes it through all the time), so registers that clock on the leading edge of</text>
<text x="14" y="452" font-size="11" fill="#444">WR* see stable data. IORQ* + WR* with M1* high is an ordinary I/O write.</text>
