<line x1="700.0" y1="87.0" x2="850.0" y2="87.0" stroke="#1f5fa8" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="0" y="102" width="6" height="30" fill="#8a4fbf"/>
<rect x="0" y="102" width="6" height="30" fill="#8a4fbf"/>
