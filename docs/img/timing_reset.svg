<rect x="0" y="162" width="6" height="30" fill="#8a4fbf"/>
<rect x="0" y="162" width="6" height="30" fill="#8a4fbf"/>
<text x="14" y="181" font-size="12.5" fill="#8a4fbf">Strobes at U5 (LS244 inputs)</text>
<polygon points="250.0,177.0 255.0,167.0 695.0,167.0 700.0,177.0 695.0,185.0 255.0,185.0" fill="#ffffff" stroke="#8a4fbf" stroke-width="1.5"/>
<text x="475.0" y="181.0" font-size="11" text-anchor="middle" fill="#222">follow the Model I</text>
<polygon points="700.0,177.0 705.0,167.0 845.0,167.0 850.0,177.0 845.0,185.0 705.0,185.0" fill="#ffffff" stroke="#8a4fbf" stroke-width="1.5"/>
<text x="775.0" y="181.0" font-size="11" text-anchor="middle" fill="#222">float high = idle</text>
<rect x="14" y="213" width="10" height="10" fill="#1f5fa8"/>
<text x="28" y="222" font-size="11" fill="#333">Model I expansion bus</text>
<rect x="193" y="213" width="10" height="10" fill="#8a4fbf"/>
<text x="207" y="222" font-size="11" fill="#333">Bridge card</text>
<rect x="302" y="213" width="10" height="10" fill="#c0392b"/>
<text x="316" y="222" font-size="11" fill="#333">ECB bus</text>
<text x="14" y="240" font-size="11" fill="#444">With the ribbon unplugged, R4 holds RESET* low, so every ECB card stays in reset, and the LS244's open inputs</text>
<text x="14" y="256" font-size="11" fill="#444">read high, so no strobe is active. A connected Model I drives SYSRES* and overrides R4.</text>
