<line x1="250.0" y1="95.0" x2="490.0" y2="95.0" stroke="#1f5fa8" stroke-width="2"/>
<line x1="490.0" y1="77.0" x2="490.0" y2="95.0" stroke="#1f5fa8" stroke-width="2"/>
<line x1="490.0" y1="77.0" x2="700.0" y2="77.0" stroke="#1f5fa8" stroke-width="2"/>
