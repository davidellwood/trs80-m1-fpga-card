<rect x="319" y="333" width="10" height="10" fill="#1f5fa8"/>
<text x="333" y="342" font-size="11" fill="#333">Model I expansion bus</text>
<rect x="498" y="333" width="10" height="10" fill="#8a4fbf"/>
<text x="512" y="342" font-size="11" fill="#333">Bridge card</text>
<rect x="607" y="333" width="10" height="10" fill="#c0392b"/>
<text x="621" y="342" font-size="11" fill="#333">ECB bus</text>
<text x="14" y="360" font-size="11" fill="#444">Bridge delays (10-30 ns) are drawn wider than scale so the edges can be told apart; one T-state is 564 ns.</text>
<text x="14" y="376" font-size="11" fill="#444">Difference from a real Z80: there, M1* is low on every opcode fetch. The Model I bus only reports M1* during</text>
<text x="14" y="392" font-size="11" fill="#444">interrupt acknowledge (INTAK*), so ECB M1* is low only then. Cards use M1* just to tell INTA apart from an I/O</text>
<text x="14" y="408" font-size="11" fill="#444">cycle (IORQ* with M1* high), which works. A card that needs opcode-fetch M1* (rare) won't work on this bridge.</text>
