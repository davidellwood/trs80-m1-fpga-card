<text x="14" y="480" font-size="11" fill="#444">Bridge delays (10-30 ns) are drawn wider than scale so the edges can be told apart; one T-state is 564 ns.</text>
<text x="14" y="496" font-size="11" fill="#444">ECB MREQ* and RD* both come from the Model I's memory RD*, so they start and end together, as on a real Z80.</text>
<text x="14" y="512" font-size="11" fill="#444">The claim GAL turns U7 toward the Model I only because 3000h is a card address; for a ROM or video read it stays off.</text>
